<!DOCTYPE html>
<html>
    <head>
        <title>Registro de Marcas</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <h1>Registro de marcas</h1>
        <p th:if="${error}" th:text="${error}"></p>
        <form th:action="@{/marcas/guardar}" th:object="${marca}" method="post">
            <input type="hidden" th:field="*{idMarca}">
            <label>Nombre</label>
            <input type="text" class="form-control" th:field="*{nombre}">
            <button type="submit" class="btn btn-primary">Guardar</button>
        </form>
        
        <table class="table table-striped">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Acciones</th>
            </tr>
            <tr th:each="m : ${marcas}">
                <td th:text="${m.idMarca}"></td>
                <td th:text="${m.nombre}"></td>
                <td>
                    <a th:href="@{/marcas/editar/{id}(id=${m.idMarca})}" class="btn btn-secondary">Editar</a>
                    <form th:action="@{/marcas/eliminar/{id}(id=${m.idMarca})}" method="post">
                        <button type="submit" class="btn btn-danger">Eliminar</button>
                    </form>
                </td>
            </tr>
        </table>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
